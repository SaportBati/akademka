<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Реестр отчётов</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="shell">
  <div class="loading">Загрузка…</div>
</div>

<script>
  // Точка входа: просто отправляем на нужный экран в зависимости от того,
  // залогинен пользователь или нет. Вся реальная логика — на отдельных страницах.
  (function(){
    var AUTH_KEY = 'reestr_auth_v1';
    var authed = false;
    try{
      var raw = localStorage.getItem(AUTH_KEY);
      authed = !!(raw && JSON.parse(raw) && JSON.parse(raw).token);
    }catch(e){ authed = false; }
    location.replace(authed ? 'list.html' : 'auth.html');
  })();
</script>
</body>
</html>
